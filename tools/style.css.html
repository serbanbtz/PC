<style>
:root {
  --bg:#fafaf9; --surface:#ffffff; --text:#1c1917; --muted:#57534e; --border:#e7e5e4;
  --accent:#cc0000; --quote-bg:#f5f5f4; --quote-border:#a8a29e; --mark-bg:#fef08a; --mark-text:#1c1917;
  --th-bg:#f5f5f4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0c0a09; --surface:#1c1917; --text:#f5f5f4; --muted:#a8a29e; --border:#292524;
    --accent:#ff5c5c; --quote-bg:#1c1917; --quote-border:#57534e; --mark-bg:#854d0e; --mark-text:#fef9c3;
    --th-bg:#292524;
  }
}
:root[data-theme="dark"] {
  --bg:#0c0a09; --surface:#1c1917; --text:#f5f5f4; --muted:#a8a29e; --border:#292524;
  --accent:#ff5c5c; --quote-bg:#1c1917; --quote-border:#57534e; --mark-bg:#854d0e; --mark-text:#fef9c3;
  --th-bg:#292524;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
nav.toc { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border);
  display:flex; gap:6px; overflow-x:auto; padding:10px 16px; -webkit-overflow-scrolling:touch; }
nav.toc a { flex:0 0 auto; font-size:13px; text-decoration:none; color:var(--muted);
  border:1px solid var(--border); border-radius:999px; padding:4px 10px; white-space:nowrap; }
nav.toc a:hover { color:var(--accent); border-color:var(--accent); }
h1 { font-size:26px; line-height:1.25; margin:8px 0 12px; }
h2 { font-size:21px; margin:40px 0 12px; padding-top:12px; border-top:2px solid var(--accent); scroll-margin-top:56px; }
h3 { font-size:17px; margin:28px 0 8px; scroll-margin-top:56px; }
p, li { overflow-wrap:anywhere; }
blockquote { margin:12px 0; padding:12px 16px; background:var(--quote-bg);
  border-left:4px solid var(--quote-border); border-radius:6px; }
blockquote p { margin:6px 0; }
blockquote ul, blockquote ol { padding-left:20px; margin:6px 0; }
mark.fill { background:var(--mark-bg); color:var(--mark-text); padding:0 3px; border-radius:3px; }
.tbl { overflow-x:auto; margin:12px 0; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
table { border-collapse:collapse; width:100%; font-size:14px; }
th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--border); }
th { background:var(--th-bg); }
tr:last-child td { border-bottom:0; }
hr { border:0; height:0; margin:24px 0; }
em { color:var(--muted); }
blockquote em { color:inherit; }
code { font-size:0.9em; }
li.todo { list-style:none; margin-left:-1.15em; }
</style></head>
